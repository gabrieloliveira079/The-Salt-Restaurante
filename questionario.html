<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionário - The Salt</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:Segoe UI;
    margin:0;
}

nav{
    background:black;
    padding:15px;
    text-align:center;
}

nav a{
    color:#c9a86a;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#c9a86a;
    margin-top:30px;
}

form{
    background:#1e1e1e;
    width:600px;
    margin:30px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    color:#c9a86a;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:5px;
    background:#2b2b2b;
    color:white;
    font-size:15px;
}

textarea{
    height:100px;
    resize:none;
}

.radio-group{
    margin-top:8px;
}

.radio-group input{
    width:auto;
    margin-right:5px;
}

button{
    width:100%;
    margin-top:30px;
    padding:15px;
    border:none;
    border-radius:5px;
    background:#c9a86a;
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:white;
}

</style>

</head>

<body>

<nav>

<a href="indexrestaurante.html">Início</a>

<a href="pratos.html">Pratos Feitos</a>

<a href="drinks.html">Drinks</a>

<a href="questionario.html">Questionário</a>


</nav>

<h1>Pesquisa de Satisfação</h1>

<form>

<label>1. Qual é o seu nome?</label>
<input type="text" placeholder="Digite seu nome">

<label>2. Qual sua idade?</label>
<input type="number" placeholder="Digite sua idade">

<label>3. Como conheceu o restaurante?</label>
<select>
    <option>Instagram</option>
    <option>TikTok</option>
    <option>Google</option>
    <option>Indicação de amigos</option>
</select>

<label>4. Qual prato você mais gostou?</label>
<select>
    <option>Wagyu com fritas</option>
    <option>Filé Mignon</option>
    <option>Costeleta</option>
    <option>Filézinho</option>
</select>

<label>5. Como avalia nosso atendimento?</label>

<div class="radio-group">
<input type="radio" name="atendimento"> Excelente
</div>

<div class="radio-group">
<input type="radio" name="atendimento"> Bom
</div>

<div class="radio-group">
<input type="radio" name="atendimento"> Regular
</div>

<div class="radio-group">
<input type="radio" name="atendimento"> Ruim
</div>

<label>6. O ambiente estava agradável?</label>

<div class="radio-group">
<input type="radio" name="ambiente"> Sim
</div>

<div class="radio-group">
<input type="radio" name="ambiente"> Não
</div>

<label>7. O tempo de espera foi bom?</label>

<div class="radio-group">
<input type="radio" name="espera"> Sim
</div>

<div class="radio-group">
<input type="radio" name="espera"> Não
</div>

<label>8. Você gostou dos drinks?</label>

<div class="radio-group">
<input type="radio" name="drinks"> Sim
</div>

<div class="radio-group">
<input type="radio" name="drinks"> Não
</div>

<label>9. De 0 a 10, qual nota você dá ao restaurante?</label>
<input type="number" min="0" max="10">

<label>10. O que podemos melhorar?</label>
<textarea placeholder="Digite sua opinião"></textarea>

<button type="submit">
Enviar Questionário
</button>

</form>

</body>
</html>
